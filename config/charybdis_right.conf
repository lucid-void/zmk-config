CONFIG_SPI=y
# CONFIG_ZMK_MOUSE is deprecated on main; ZMK_POINTING selects INPUT and is
# required on the peripheral for zmk,input-split to be built.
CONFIG_ZMK_POINTING=y
CONFIG_PMW3610_ALT=y
CONFIG_ZMK_EXT_POWER=y

# Swap/invert moved to devicetree (swap-xy; invert-x; invert-y;) in
# boards/shields/charybdis/charybdis_3610.dtsi
#CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=12
# If the sensor reports "Incorrect product id 0xFF" on nice!nano, try:
#CONFIG_PMW3610_ALT_INIT_POWER_UP_EXTRA_DELAY_MS=1000

#CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9
#CONFIG_BT_PERIPHERAL_PREF_LATENCY=16
#CONFIG_BT_BUF_ACL_TX_COUNT=32
#CONFIG_BT_L2CAP_TX_BUF_COUNT=32

#CONFIG_SPI_LOG_LEVEL_DBG=y

CONFIG_PMW3610_ALT_REST1_SAMPLE_TIME_MS=100
CONFIG_PMW3610_ALT_REST2_SAMPLE_TIME_MS=200
CONFIG_PMW3610_ALT_REST3_SAMPLE_TIME_MS=300
CONFIG_PMW3610_ALT_RUN_DOWNSHIFT_TIME_MS=500
CONFIG_PMW3610_ALT_REST1_DOWNSHIFT_TIME_MS=3000
CONFIG_PMW3610_ALT_REST2_DOWNSHIFT_TIME_MS=30000
