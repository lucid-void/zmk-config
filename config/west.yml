manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: badjeff
      url-base: https://github.com/badjeff
    - name: 280Zo
      url-base: https://github.com/280Zo
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    # PMW3610 driver. main/zmk-0.4 tracks ZMK main (Zephyr 4.1).
    # Uses compatible "pixart,pmw3610-alt" and CONFIG_PMW3610_ALT_* options.
    - name: zmk-pmw3610-driver
      remote: badjeff
      revision: main
    # zmk-split-peripheral-input-relay and zmk-input-behavior-listener are
    # no longer needed: ZMK main has native split input (zmk,input-split)
    # and input processors (scaler, temp-layer, code-mapper, transform).
    - name: prospector-zmk-module
      remote: 280Zo
      revision: main
  self:
    path: config
