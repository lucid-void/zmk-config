CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# No APDS9960 ambient-light sensor on this build; use fixed brightness
# instead. This also avoids a link conflict: PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR
# normally selects prospector-zmk-module's own ALS-only APDS9960 driver
# (CONFIG_PROSPECTOR_APDS9960), which binds to the same "avago,apds9960"
# devicetree node (added by the prospector_adapter shield) as Zephyr's stock
# APDS9960 driver -- with both enabled you get two device_dts_ord_* struct
# definitions for that node and a "multiple definition" link error.
# CONFIG_APDS9960=n is kept explicitly in case some other config re-enables
# ambient light sensing later. Harmless on boards without an apds9960 node.
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_APDS9960=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=80

# CONFIG_ZMK_MOUSE is deprecated on main; ZMK_POINTING selects INPUT
CONFIG_ZMK_POINTING=y

CONFIG_ZMK_SLEEP=n
