# Both halves connect to the dongle
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# Collect the halves' battery levels so Prospector can show them,
# and forward them to the host as separate HID battery reports
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# USB powered, never sleep
CONFIG_ZMK_SLEEP=n

# Blank the screen and kill the backlight after a minute of inactivity
CONFIG_ZMK_IDLE_TIMEOUT=60000
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

## Prospector
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=80

CONFIG_PROSPECTOR_STATUS_SCREEN_RADII=n
CONFIG_PROSPECTOR_STATUS_SCREEN_FIELD=n
CONFIG_PROSPECTOR_STATUS_SCREEN_OPERATOR=y
