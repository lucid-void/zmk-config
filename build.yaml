# This file generates the GitHub Actions matrix.
# Board names follow ZMK main (Zephyr 4.1, HWMv2): in-tree boards need the
# //zmk variant. nice_nano//zmk defaults to the v2 revision.
#
# artifact-name keeps the old, short UF2 file names instead of the
# auto-derived "<shield>-<board>__zmk-zmk.uf2".
---
include:
  - board: xiao_ble//zmk #prospector dongle
    shield: charybdis_dongle prospector_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
    artifact-name: charybdis_dongle-xiao_ble
  - board: nice_nano//zmk
    shield: charybdis_dongle
    artifact-name: charybdis_dongle-nice_nano

  - board: nice_nano//zmk
    shield: charybdis_left
    artifact-name: charybdis_left
  - board: nice_nano//zmk
    shield: charybdis_right
    artifact-name: charybdis_right

  - board: xiao_ble//zmk
    shield: settings_reset
    artifact-name: settings_reset-xiao_ble
  - board: nice_nano//zmk
    shield: settings_reset
    artifact-name: settings_reset-nice_nano
