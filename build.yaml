# Wiring-test branch: standalone (non-split, no BLE-to-other-half) builds of
# each half, for bring-up testing before switches are soldered in. Each half
# runs its own matrix scan + keymap locally and types over USB HID, so you
# can short individual key pads (tweezers/multimeter) and watch characters
# appear in a text editor to confirm every row/col is wired correctly.
#
# -DCONFIG_ZMK_SPLIT=n overrides the shield's own Kconfig.defconfig default
# (ZMK_SPLIT=y), so there's no BLE central/peripheral role and no dependency
# on the other half or the dongle.
---
include:
  - board: nice_nano//zmk
    shield: charybdis_left
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_ZMK_SPLIT=n
    artifact-name: charybdis_left-standalone
  - board: nice_nano//zmk
    shield: charybdis_right
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_ZMK_SPLIT=n
    artifact-name: charybdis_right-standalone
